# 52-bluez-audio.conf — Bluetooth audio policy (added 2026-10-25, Omega audio setup)
# Goal: every BT audio device comes up in A2DP (music quality), never HFP/headset,
#       SBC-XQ offered, no auto-switch to headset profile (see 51-disable-bluetooth-headset.conf).
# Undo: rm this file && systemctl --user restart wireplumber

monitor.bluez.properties = {
  bluez5.enable-sbc-xq    = true      # offer SBC-XQ (a2dp-sink-sbc_xq), ~450-550 kbit/s
  bluez5.enable-msbc      = true      # wideband voice only when HFP is chosen by hand
  bluez5.enable-hw-volume = true      # AVRCP absolute volume (one volume knob)
  # No legacy HSP. HFP stays available for `q1-mode call` but is never auto-selected.
  bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source hfp_hf hfp_ag ]
}

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
  bluetooth.profile-preference            = "quality"
}

# When no profile is stored, prefer A2DP (SBC-XQ first) on BT devices.
device.profile.priority.rules = [
  {
    matches = [ { device.name = "~bluez_card.*" } ]
    actions = {
      update-props = {
        priorities = [ "a2dp-sink-sbc_xq", "a2dp-sink", "a2dp-auto-prefer-quality" ]
      }
    }
  }
]

monitor.bluez.rules = [
  {
    # JBL Charge 5 — pure A2DP speaker (SBC only)
    matches = [ { device.name = "bluez_card.F8_5C_7E_A7_22_75" } ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ a2dp_sink ]
        device.profile      = "a2dp-sink"
      }
    }
  }
  {
    # Q1 BT receiver (JieLi AC696N) feeding the amp — always A2DP; HFP only via `q1-mode call`
    matches = [ { device.name = "bluez_card.33_00_1F_72_86_60" } ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ a2dp_sink ]
        device.profile      = "a2dp-sink-sbc_xq"
      }
    }
  }
  {
    # BT output nodes: extra buffer to ride out 2.4 GHz contention; no idle suspend pops
    matches = [ { node.name = "~bluez_output.*" } ]
    actions = { update-props = { node.latency = "1024/48000" session.suspend-timeout-seconds = 0 } }
  }
]
